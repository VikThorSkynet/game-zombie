<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Galeria de inimigos</title><style>body{margin:0;background:#111923;color:#e8f0f5;font:16px system-ui}header{padding:22px 32px}h1{margin:0 0 8px}p{color:#bacbd7;margin:6px 0}main{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 24px 24px}.card{background:#202d39;border:1px solid #3b4c5d;border-radius:12px;overflow:hidden}.view{height:300px;position:relative;touch-action:none}.info{padding:12px}.info b{font-size:19px}small{display:block;color:#b8c9d7;margin:6px 0}select,button{background:#324759;color:white;border:1px solid #6c879d;border-radius:5px;padding:6px;margin:4px}canvas{position:fixed;inset:0;pointer-events:none}header,.info{position:relative;z-index:1}@media(max-width:850px){main{grid-template-columns:repeat(2,1fr)}} </style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<header><h1>Escolha o papel de cada zumbi</h1><p>Arraste para girar · role sobre o modelo para aproximar · selecione uma animação quando disponível.</p><p>Identifique sua escolha pelo código Z01–Z08. D01 e D02 serão cães. P01 é o personagem principal.</p><button id="save">Salvar escolhas em JSON</button><span id="status">Carregando modelos…</span></header><main></main><canvas id="canvas"></canvas>
<script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0x202d39,1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;
const manifest=await(await fetch('manifest.json')).json(),views=[];window.gallery={views,manifest,ready:false};let choices=JSON.parse(localStorage.getItem('enemy-choices')||'{}');
for(const item of manifest){const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="view"></div><div class="info"><b>${item.id.toUpperCase()} · ${item.title}</b><small>${item.source}</small><span class="anim"></span></div>`;document.querySelector('main').append(card);const element=card.querySelector('.view'),scene=new T.Scene(),camera=new T.PerspectiveCamera(36,1,.01,1000);scene.add(new T.HemisphereLight(0xe4f3ff,0x67645a,2.5));const light=new T.DirectionalLight(0xffead6,3);light.position.set(3,5,4);scene.add(light);const back=new T.DirectionalLight(0x8cbcff,2);back.position.set(-3,3,-4);scene.add(back);const controls=new OrbitControls(camera,element);controls.enablePan=false;controls.enableDamping=true;
try{const gltf=await new GLTFLoader().loadAsync(item.file);const root=new T.Group();root.add(gltf.scene);scene.add(root);if(item.id==='z04')root.rotation.y=Math.PI;root.updateMatrixWorld(true);let box=new T.Box3().setFromObject(root),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());const scale=2.5/Math.max(size.x,size.y,size.z);gltf.scene.scale.multiplyScalar(scale);gltf.scene.position.addScaledVector(center,-scale);root.updateMatrixWorld(true);box=new T.Box3().setFromObject(root);const floor=new T.Mesh(new T.CircleGeometry(2.8,48),new T.MeshStandardMaterial({color:0x394553,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=box.min.y-.02;scene.add(floor);camera.position.set(0,.25,5.3);controls.target.set(0,0,0);controls.update();const mixer=new T.AnimationMixer(gltf.scene);const animation=document.createElement('select');animation.innerHTML='<option value="-1">Pose original</option>'+gltf.animations.map((a,i)=>`<option value="${i}">${a.name}</option>`).join('');card.querySelector('.anim').append(animation);animation.onchange=()=>{mixer.stopAllAction();if(+animation.value>=0)mixer.clipAction(gltf.animations[+animation.value]).play()};if(gltf.animations.length){animation.value='0';animation.onchange()};const v={item,scene,camera,controls,element,root,mixer,gltf,scale};views.push(v);
if(item.id.startsWith('z')){const select=document.createElement('select');select.innerHTML=['Escolher tipo','Normal','Corredor','Bruto','Atirador','Detonador','Guardião','Não usar'].map(x=>`<option>${x}</option>`).join('');select.value=choices[item.id]||'Escolher tipo';select.onchange=()=>{choices[item.id]=select.value;localStorage.setItem('enemy-choices',JSON.stringify(choices))};card.querySelector('.info').append(select)}
}catch(e){card.querySelector('.anim').textContent='Erro: '+e.message;console.error(item.id,e)}}
window.gallery.ready=true;document.querySelector('#status').textContent=` ${views.length} modelos carregados`;document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(choices,null,2)],{type:'application/json'}));a.download='escolhas-zumbis.json';a.click();URL.revokeObjectURL(a.href)};
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;renderer.setSize(innerWidth,innerHeight,false);renderer.setScissorTest(false);renderer.clear();renderer.setScissorTest(true);for(const v of views){const r=v.element.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;v.mixer.update(dt);v.controls.update();v.camera.aspect=r.width/r.height;v.camera.updateProjectionMatrix();renderer.setViewport(r.left,innerHeight-r.bottom,r.width,r.height);renderer.setScissor(r.left,Math.max(0,innerHeight-r.bottom),r.width,r.height);renderer.render(v.scene,v.camera)}}requestAnimationFrame(frame);
</script></html>
